name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: build laravel backend (Linux/Docker)
        run: |
          cd app2BackEnd
          docker build -t laravel-builder -f static-build.Dockerfile .
          # Use a unique name or force remove if it exists (though runner should be clean)
          docker rm -f temp-builder || true
          docker create --name temp-builder laravel-builder
          mkdir -p ../app2FrontEnd/src-tauri/internal
          docker cp temp-builder:/go/src/app/frankenphp ../app2FrontEnd/src-tauri/internal/laravel-backend
          docker rm -f temp-builder

      - name: install frontend dependencies
        run: |
          cd app2FrontEnd
          npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action will automatically replace this
          releaseName: "App v__VERSION__"
          releaseBody: "Automated production build (Linux)."
          releaseDraft: true
          prerelease: false
          projectPath: "app2FrontEnd"