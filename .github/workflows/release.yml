name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install system dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Free disk space & create swap (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup internal directory and stubs
        shell: bash
        run: |
          mkdir -p app2FrontEnd/src-tauri/internal
          # We create stubs so the Rust 'include_bytes!' macro doesn't fail on either platform
          touch app2FrontEnd/src-tauri/internal/laravel-backend
          touch app2FrontEnd/src-tauri/internal/laravel-backend.exe

      - name: set up Docker Buildx (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: docker/setup-buildx-action@v3

      - name: build laravel backend binary (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: docker/build-push-action@v6
        with:
          context: app2BackEnd
          file: app2BackEnd/static-build.Dockerfile
          tags: laravel-builder:latest
          load: true
          build-args: |
            MAKE_JOBS=2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: extract backend binary (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          docker create --name temp-builder laravel-builder:latest
          docker cp temp-builder:/go/src/app/frankenphp app2FrontEnd/src-tauri/internal/laravel-backend
          docker rm -f temp-builder
          chmod +x app2FrontEnd/src-tauri/internal/laravel-backend

      - name: install frontend dependencies
        run: |
          cd app2FrontEnd
          npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.ref_name }}
          releaseName: "App Release - ${{ github.ref_name }}"
          releaseBody: "Automated production build. Compiled for Windows and Linux."
          releaseDraft: true
          prerelease: false
          projectPath: "app2FrontEnd"