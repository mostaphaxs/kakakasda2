name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install system dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Free disk space & create swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🧹 Nuclear Cleanup (Force under 2GB)
        run: |
          cd app2BackEnd
          # Remove heavy SQLite, logs, and vendor
          rm -f database/*.sqlite
          rm -rf storage/logs/*
          rm -rf storage/framework/views/*
          rm -rf node_modules
          
          # Remove any local FrankenPHP artifacts
          rm -rf static-php-cli/
          rm -rf buildroot/
          rm -rf pkgroot/
          
          # CRITICAL: Delete .git history so it isn't embedded
          rm -rf .git
          
          echo "Final folder size before Docker context:"
          du -sh .

      - name: build laravel backend binary
        uses: docker/build-push-action@v6
        with:
          context: app2BackEnd
          file: app2BackEnd/static-build.Dockerfile
          tags: laravel-builder:latest
          load: true
          # We limit parallel jobs to 2 to prevent RAM exhaustion (OOM)
          build-args: |
            MAKE_JOBS=2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: extract backend binary
        run: |
          mkdir -p app2FrontEnd/src-tauri/internal
          docker create --name temp-builder laravel-builder
          docker cp temp-builder:/go/src/app/frankenphp app2FrontEnd/src-tauri/internal/laravel-backend
          docker rm -f temp-builder
          chmod +x app2FrontEnd/src-tauri/internal/laravel-backend

      - name: install frontend dependencies
        run: |
          cd app2FrontEnd
          npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "Automated production build. Compiled on Ubuntu 22.04. Contact: asdas@gmail.com"
          releaseDraft: true
          prerelease: false
          projectPath: "app2FrontEnd"