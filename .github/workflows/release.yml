name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            php-cli php-sqlite3 php-mbstring php-xml php-curl

      # ─── Bundle the Laravel backend ──────────────────────────────────────────
      - name: Install Composer dependencies (in app2BackEnd)
        shell: bash
        working-directory: app2BackEnd
        run: |
          curl -sS https://getcomposer.org/installer | php
          php composer.phar install --no-dev --optimize-autoloader --no-scripts --ignore-platform-reqs
          rm composer.phar

      - name: Copy Laravel backend into Tauri resources
        shell: bash
        run: |
          mkdir -p app2FrontEnd/src-tauri/backend
          cp -r app2BackEnd/app \
                app2BackEnd/bootstrap \
                app2BackEnd/config \
                app2BackEnd/database \
                app2BackEnd/public \
                app2BackEnd/routes \
                app2BackEnd/artisan \
                app2BackEnd/vendor \
                app2FrontEnd/src-tauri/backend/
          cp app2BackEnd/.env app2FrontEnd/src-tauri/backend/.env || true
          # Create writable storage skeleton
          mkdir -p app2FrontEnd/src-tauri/backend/storage/framework/{sessions,views,cache}
          mkdir -p app2FrontEnd/src-tauri/backend/storage/{logs,app/public}

      # ─── Linux: copy system PHP as sidecar binary ────────────────────────────
      - name: Prepare PHP sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          PHP_BIN=$(which php)
          echo "Using PHP: $PHP_BIN"
          cp "$PHP_BIN" "app2FrontEnd/src-tauri/binaries/php/php-x86_64-unknown-linux-gnu"
          chmod +x "app2FrontEnd/src-tauri/binaries/php/php-x86_64-unknown-linux-gnu"

      # ─── Windows: PHP binaries committed to repo — verify ────────────────────
      - name: Verify PHP sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bin = "app2FrontEnd\src-tauri\binaries\php\php-x86_64-pc-windows-msvc.exe"
          if (-Not (Test-Path $bin)) {
            Write-Error "❌ Missing Windows PHP sidecar: $bin"
            exit 1
          }
          Write-Host "✅ PHP sidecar found: $bin"

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd app2FrontEnd
          npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TechStock-ERP ${{ github.ref_name }}"
          releaseBody: "Système de Gestion ERP TechStock - Windows & Linux. Contact: mostaphaff123@gmail.com"
          releaseDraft: false
          prerelease: false
          projectPath: "app2FrontEnd"
          args: "--target ${{ matrix.target }} --verbose"