name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install system dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('app2BackEnd/static-build.Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: build laravel backend binary
        uses: docker/build-push-action@v6
        with:
          context: app2BackEnd
          file: app2BackEnd/static-build.Dockerfile
          tags: laravel-builder:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: move cache (prevent cache growth)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: extract backend binary
        run: |
          mkdir -p app2FrontEnd/src-tauri/internal
          docker create --name temp-builder laravel-builder
          docker cp temp-builder:/go/src/app/frankenphp app2FrontEnd/src-tauri/internal/laravel-backend
          docker rm -f temp-builder
          chmod +x app2FrontEnd/src-tauri/internal/laravel-backend

      - name: install frontend dependencies
        run: |
          cd app2FrontEnd
          npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "Automated production build (Linux)."
          releaseDraft: true
          prerelease: false
          projectPath: "app2FrontEnd"