
name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Node 24 might be too new for some plugins, 22 is solid LTS

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: phar, mbstring, openssl, curl, fileinfo, zip

      - name: Build standalone backend binary
        shell: bash
        run: |
          cd app2BackEnd
          php build-standalone.php

          echo ""
          echo "=== Generated binaries ==="
          ls -lh ../app2FrontEnd/src-tauri/internal/

      - name: Install frontend dependencies
        run: |
          cd app2FrontEnd
          npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName:      ${{ github.ref_name }}
          releaseName:  "MyAmical ${{ github.ref_name }}"
          releaseBody:  "Production release with embedded native backend."
          releaseDraft: false
          prerelease:   false
          projectPath:  "app2FrontEnd"
          args:         "--target ${{ matrix.target }}"