name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ─── Bundle the Laravel backend ──────────────────────────────────────────
      - name: Install Composer dependencies (in app2BackEnd)
        shell: bash
        working-directory: app2BackEnd
        run: |
          curl -sS https://getcomposer.org/installer | php
          php composer.phar install --no-dev --optimize-autoloader --no-scripts --ignore-platform-reqs
          rm composer.phar

      - name: Copy Laravel backend into Tauri resources
        shell: bash
        run: |
          mkdir -p app2FrontEnd/src-tauri/backend
          cp -r app2BackEnd/app \
                app2BackEnd/bootstrap \
                app2BackEnd/config \
                app2BackEnd/database \
                app2BackEnd/public \
                app2BackEnd/routes \
                app2BackEnd/artisan \
                app2BackEnd/vendor \
                app2FrontEnd/src-tauri/backend/
          # Copy .env for production defaults
          cp app2BackEnd/.env app2FrontEnd/src-tauri/backend/.env || true

      - name: Create storage skeleton
        shell: bash
        run: |
          mkdir -p app2FrontEnd/src-tauri/backend/storage/framework/sessions
          mkdir -p app2FrontEnd/src-tauri/backend/storage/framework/views
          mkdir -p app2FrontEnd/src-tauri/backend/storage/framework/cache
          mkdir -p app2FrontEnd/src-tauri/backend/storage/logs
          mkdir -p app2FrontEnd/src-tauri/backend/storage/app/public

      # ─── Linux: create sidecar symlink to system PHP ─────────────────────────
      - name: Prepare PHP sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-xml php-curl
          PHP_BIN=$(which php)
          cp "$PHP_BIN" "app2FrontEnd/src-tauri/binaries/php/php-x86_64-unknown-linux-gnu"
          chmod +x "app2FrontEnd/src-tauri/binaries/php/php-x86_64-unknown-linux-gnu"

      # ─── Windows: PHP binaries already committed; verify they exist ──────────
      - name: Verify PHP sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bin = "app2FrontEnd\src-tauri\binaries\php\php-x86_64-pc-windows-msvc.exe"
          if (-Not (Test-Path $bin)) {
            Write-Error "❌ Missing: $bin"
            exit 1
          }
          Write-Host "✅ PHP sidecar present: $bin"

      - name: Install frontend dependencies
        run: |
          cd app2FrontEnd
          npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MyAmical ${{ github.ref_name }}"
          releaseBody: "Windows & Linux release. Contact: mostaphaff123@gmail.com"
          releaseDraft: false
          prerelease: false
          projectPath: "app2FrontEnd"
          args: "--target ${{ matrix.target }}"